<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>가닥 전체 지도</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="/ui/mark.js"></script>
<style>
/* 전체 지도 · 한 줄 노선도 시안 — 마시모 비녤리의 1972 뉴욕 지하철 지도(system map)와 열차 안 노선도(strip map)에서 가져온 것:
   90° · 45° 격자, 노선마다 한 색, 흰 틈을 둔 나란한 묶음, 역마다 점, 45°로 선 역 이름, 역 아래에 쌓는 동그라미. */
:root {
  --spur: #A7A9AC;
  --paper: #FFFFFF; --ink: #111111; --ink2: #6B6B6B; --ink3: #A6A6A6; --grid: #EFEFEF; --today: #F6F6F6; --band: #111111; --band-fg: #FFFFFF; --poster: #F4F1EA;
  /* 글꼴은 한 벌: 로마자 · 숫자는 헬베티카(비녤리의 뉴욕 지하철), 한글은 Pretendard로 이어져요. 값은 shared/ui/tokens.css와 같아요 */
  --font: "Helvetica Neue", Helvetica, Pretendard, "Apple SD Gothic Neo", sans-serif; --vfont: var(--font);
  --tr-title: -0.08em; --tr-body: -0.05em; --tr-small: -0.03em;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121212; --ink: #F2F2F2; --ink2: #9A9A9A; --ink3: #5E5E5E; --grid: #1E1E1E; --today: #191919; --band: #000000; --band-fg: #F2F2F2; --poster: #171614; } }
:root[data-theme="dark"] { --paper: #121212; --ink: #F2F2F2; --ink2: #9A9A9A; --ink3: #5E5E5E; --grid: #1E1E1E; --today: #191919; --band: #000000; --band-fg: #F2F2F2; --poster: #171614; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); font-family: var(--font); overflow: hidden; }

/* 지하철 표지판의 검은 띠 */
header { position: fixed; inset: 0 0 auto 0; height: 48px; white-space: nowrap; background: var(--band); color: var(--band-fg);
  display: flex; align-items: center; gap: 12px; padding: 0 20px; z-index: 3; }
header b { font-size: 22px; }
header b i { font: normal 700 22px var(--vfont); margin-left: 6px; }
/* 가닥 심볼 (shared/ui/mark.js). 검은 띠 위라서 선은 흰색, 지금 점은 가닥의 빨강 */
header .mark { display: block; overflow: visible; cursor: pointer; margin-right: -4px; }
header .mark line { stroke: var(--band-fg); }
header .mark .m-main { fill: var(--band); stroke: var(--band-fg); }
header .mark .m-spur { fill: var(--band); stroke: #8C8C8C; }
header .mark .m-now { fill: #C8401A; stroke: none; }
header .open, header .close { display: none; margin-left: 12px; border: 1px solid rgba(255,255,255,.5); background: none; color: inherit;
  font: 600 13px var(--font); padding: 5px 12px; cursor: pointer; }
.strip-on header .open { display: inline-block; }
.embed header .close { display: inline-block; margin-left: auto; }
.embed header small { display: none; }
header span { font-size: 15px; }
header small { margin-left: auto; font-size: 12px; opacity: .65; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 980px) { header small, header .crumb-map { display: none; } }
header button { display: none; border: 0; background: none; color: inherit; font: 700 15px var(--font); padding: 6px 0; cursor: pointer; }
.strip-on header button, .strip-on #crumb { display: inline; }
#crumb { display: none; }
.strip-on header .crumb-map { display: none; }

svg.view { position: fixed; inset: 48px 0 0 0; width: 100%; height: calc(100% - 48px); cursor: grab; touch-action: none;
  transition: opacity .35s, transform .35s; }
svg.view.drag { cursor: grabbing; }
#strip { opacity: 0; pointer-events: none; transform: scale(.97); }
.strip-on #strip { opacity: 1; pointer-events: auto; transform: none; }
.strip-on #map { opacity: 0; pointer-events: none; }
text { font-family: var(--font); fill: var(--ink); }

/* 포스터 보기: 같은 대화를 비녤리 포스터처럼 (굵은 단색 선 · 흰 틈 · 45°와 90° 꺾임 · 큰 제목) */
#poster { opacity: 0; pointer-events: none; }
#poster text { font-family: var(--vfont); }
.poster-on #poster { opacity: 1; pointer-events: auto; }
.poster-on #map { opacity: 0; pointer-events: none; }
.poster-on #key-map { display: none; }
.p-paper { fill: var(--poster); }
.p-case { fill: none; stroke: var(--poster); stroke-width: 32; }
.p-line { fill: none; stroke-width: 22; }
.p-title { font-size: 168px; font-weight: 800; }
.p-latin { font-weight: 700; }
.p-sub { font-size: 22px; fill: var(--ink2); }
.p-name, .p-now { font-size: 22px; font-weight: 700; }
.p-here { stroke: var(--ink); stroke-width: 9; fill: none; }

.grid line { stroke: var(--grid); stroke-width: 1; }
.grid rect { fill: var(--today); }
.grid text { font-size: 14px; fill: var(--ink2); }
.grid text.now { fill: var(--ink); font-weight: 700; }
.grid text.rest { fill: var(--ink3); font-size: 12px; }

.title { font-weight: 700; cursor: pointer; }
.proj { transition: opacity .25s; }
.dim .proj:not(.hot) { opacity: .12; }
[data-chat] { cursor: pointer; }
path[data-chat]:hover { stroke-opacity: .75; }

.lbl text { font-size: 14px; transition: opacity .25s; }
.lbl .chat { font-weight: 700; font-size: 18px; }
.lbl .dec { font-weight: 700; }
.lbl .minor { fill: var(--ink2); font-size: 13px; }
.bullet { font-size: 11px; font-weight: 700; }
.dot { fill: var(--ink); }
#strip [data-turn] { cursor: pointer; }
.route { stroke-width: calc(var(--line, 13px) * var(--thick, 1)); }
/* 비녤리 스타일 */
.minor-dot { transition: opacity .25s; }
.xfer { stroke: var(--ink); stroke-width: 4; fill: none; }
.here { stroke: var(--ink); stroke-width: 6; fill: none; }
.xfer-lbl { font-size: 12px; fill: var(--ink2); transition: opacity .25s; }
/* 지금: 가닥 창과 같은 빨간 점 + 빛 (빨강은 ‘지금’에만) */
.now-ring { fill: #F6DDD4; stroke: none; }
.now-dot { fill: #C8401A; }

/* 줌에 따라 보이는 것 — 멀면 노선과 프로젝트 이름만, 중간이면 대화 이름 · 정함 · 산출물, 가까우면 모든 역 */
.far .lbl text, .far .minor-dot, .far .xfer-lbl, .far .bullet { opacity: 0; }
.mid .lbl .minor, .mid .minor-dot, .mid .xfer-lbl { opacity: 0; }

/* 한 줄 노선도 */
.st-name { font-size: 15px; }
.st-name.dec { font-weight: 700; }
.st-name.side { fill: var(--ink3); }
.st-side { fill: var(--paper); stroke: var(--ink); stroke-width: 2.5; }
/* 곁길 지선: 비녤리 지도의 회색 셔틀(S) 노선처럼 가늘고 회색 */
.spur { fill: none; stroke: var(--spur); stroke-width: 12; }
.spur-end { stroke: var(--spur); stroke-width: 5; }
.mspur { fill: none; stroke: var(--spur); stroke-width: 5; }
.mspur-end { stroke: var(--spur); stroke-width: 3; }
/* 머리띠의 보기 버튼 (스타일 · 가로세로) */
.strip-on header .axis { display: none; }
header .axis { display: inline-block; margin-left: 12px; border: 0; background: none; color: inherit; font: 500 13px var(--font);
  text-decoration: underline; text-underline-offset: 3px; cursor: pointer; opacity: .8; }
.mst-side { fill: var(--paper); stroke: var(--ink); stroke-width: 2; }
.st-end { font-size: 40px; font-weight: 700; }
.st-title { font-size: 44px; font-weight: 700; }
.st-sub { font-size: 15px; fill: var(--ink2); }
.todo { fill: var(--paper); stroke: var(--ink); stroke-width: 2.5; }
.todo.done { fill: var(--ink); }
.more { fill: var(--paper); stroke: var(--ink3); stroke-width: 1.5; }
.chip { font-size: 9.5px; font-weight: 700; }
.made { font-size: 11px; font-weight: 300; fill: var(--ink2); }

.ctl { position: fixed; right: 20px; bottom: 20px; display: flex; gap: 2px; z-index: 3; }
.ctl button { width: 40px; height: 40px; border: 0; background: var(--band); color: var(--band-fg);
  font: 700 18px var(--font); cursor: pointer; }
.ctl button.wide { width: auto; padding: 0 14px; font-size: 13px; }
.ctl button:focus-visible, header button:focus-visible { outline: 3px solid var(--ink2); outline-offset: 2px; }
.key { position: fixed; left: 20px; bottom: 20px; max-width: calc(100% - 210px); flex-wrap: wrap; display: flex; gap: 6px 16px; align-items: center; font-size: 12px;
  background: var(--paper); padding: 8px 12px; z-index: 3; }
.key i { display: inline-block; vertical-align: -1px; margin-right: 6px; background: var(--ink); }
.key i.ring { background: none; border: 2px solid var(--ink); }
#key-strip, .strip-on #key-map { display: none; }
.strip-on #key-strip { display: flex; }
@media (max-width: 600px) { .key { display: none !important; } header small { display: none; } }
/* 자간 세 단계: 본문 좁게, 13px 이하 작은 글씨는 덜 좁게, 큰 제목은 아주 좁게 */
body, text { letter-spacing: var(--tr-body); }
:is(.grid text, .lbl .minor, .bullet, .xfer-lbl, .chip, .made, .key, header small, header .axis, .ctl button.wide) { letter-spacing: var(--tr-small); }
:is(.p-title, .p-title tspan, .title, .st-title, .st-end, header b) { letter-spacing: var(--tr-title); }
</style>
</head>
<body>
<header>
  <b>가닥<i>GADAK</i></b><span class="crumb-map">전체 지도</span>
  <button class="axis" id="poster-btn" type="button">포스터로 보기</button>
  <button id="back">← 전체 지도</button><span id="crumb"></span>
  <button class="open" id="open" type="button">대화 열기</button>
  <small id="meta"></small>
  <button class="close" id="close" type="button" aria-label="전체 지도 닫기">닫기</button>
</header>
<svg id="map" class="view" aria-label="프로젝트와 대화를 노선으로 그린 전체 지도">
  <!-- 환승 화살촉: 비녤리 포스터의 굵은 검은 화살표처럼 열린 꺾쇠 -->
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto">
    <path d="M1.5 1.5 L7 5 L1.5 8.5" fill="none" style="stroke: var(--ink)" stroke-width="2" stroke-linecap="square"/></marker></defs>
  <g id="world"></g></svg>
<svg id="poster" class="view" aria-label="전체 지도를 포스터처럼 그린 그림">
  <defs><marker id="parrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto">
    <path d="M1.5 1.5 L7 5 L1.5 8.5" fill="none" style="stroke: var(--ink)" stroke-width="2" stroke-linecap="square"/></marker></defs>
  <g id="pworld"></g></svg>
<svg id="strip" class="view" aria-label="대화 하나의 한 줄 노선도"><g id="sworld"></g></svg>
<div class="key" id="key-map">
  <span><i style="width:10px;height:10px;border-radius:50%"></i>정함 (큰 점 · 굵은 이름)</span>
  <span><i style="width:10px;height:10px;border-radius:50%;background:#C8401A"></i>지금</span>
  <span><i style="width:14px;height:5px;background:var(--spur)"></i>곁길</span>
  <span><i style="width:12px;height:3px"></i>환승 (이어진 대화)</span>
  <span>노선을 누르면 한 줄 노선도로</span>
</div>
<div class="key" id="key-strip">
  <span><b>굵은 이름</b> 정함</span>
  <span><i style="width:16px;height:6px;background:var(--spur)"></i>곁길 (아래로 갈라짐)</span>
  <span><i style="width:16px;height:6px;background:var(--spur);border-right:3px solid var(--paper);box-shadow:3px 0 0 var(--spur)"></i>안 돌아온 곁길</span>
  <span><i style="width:9px;height:9px;border-radius:50%"></i>산출물 (옆에 파일 이름)</span>
  <span><i class="ring" style="width:12px;height:12px;border-radius:50%"></i>할 일</span>
  <span><i style="width:12px;height:12px;border-radius:50%"></i>끝낸 일</span>
</div>
<div class="ctl">
  <button id="out" aria-label="작게">−</button>
  <button id="fit" class="wide">전체</button>
  <button id="in" aria-label="크게">+</button>
</div>
<script type="module">
// ── 만든 예시 (실제 대화 아님). 날은 9/22를 0으로 센 번호예요.
// 턴: t 제목, d 정함, f 만들거나 바꾼 파일, todo [할 일, 끝냈나], side 곁길
let START = new Date(2026, 8, 22), TODAY = 14;
const T = (t, o = {}) => ({ t, d: o.d, f: o.f || [], todo: o.todo || [], side: o.side });
let DATA = {
  projects: [
    { name: "가닥", color: "#0039A6", chats: [
      { id: "g1", title: "가닥 기획", from: 0, to: 4, turns: [T("문제 정의"), T("노선도 은유로", { d: 1 }), T("설문 문항", { f: ["설문지.md"] }), T("입구 넷으로", { d: 1 }), T("README 초안", { f: ["README.md"], todo: [["내가 할 일 · 설문 돌리기", 1]] }), T("일정")] },
      { id: "g2", title: "프로토타입", from: 3, to: 8, turns: [T("화면 구성"), T("첫 화면", { f: ["index.html"] }), T("빨강은 지금에만", { d: 1 }), T("레일이 뭐야?", { side: 1 }), T("한마디 카드", { todo: [["빠진 요청 · 다크 모드", 0]] }), T("색 토큰", { f: ["tokens.css"] })] },
      { id: "g3", title: "백엔드", from: 6, to: 12, turns: [
        T("Flask 뼈대", { f: ["app.py"] }),
        T("2단 에이전트", { d: 1 }),
        T("분류 프롬프트", { f: ["classify.py", "classify.txt"] }),
        T("JSON이 뭐야?", { side: 1 }),
        T("스키마는 왜 필요해?", { side: 2 }),
        T("예시 하나만", { side: 1 }),
        T("기록 파일 읽기", { f: ["claude_code.py"], todo: [["빠진 요청 · Codex도 읽기", 1]] }),
        T("구독 엔진", { d: 1, f: ["claude_cli.py"] }),
        T("API 키는?", { side: 1, todo: [["이어 가기 · 키 엔진은 나중에", 0]] }),
        T("2단 확인 루프", { f: ["investigate.py", "tools.py"], todo: [["요청 외 변경 · store.py", 0]] }),
        T("자동 실행", { d: 1, f: ["auto.py"], todo: [["내가 할 일 · 켜는 문구", 0], ["빠진 요청 · 테스트", 0], ["다음 할 일 · README", 1]] }),
      ] },
      { id: "g4", title: "크롬 확장", from: 10, to: 13, turns: [T("화면 읽기"), T("내 PC로만 보냄", { d: 1 }), T("역 맞추기", { f: ["pages.py"] }), T("확인", { todo: [["빠진 요청 · ChatGPT 확인", 0]] }), T("Gemini도 될까?", { side: 1, todo: [["끝나지 않은 곁길 · 결론 없이 닫힘", 0]] })] },
      { id: "g5", title: "디자인 개편", from: 14, to: 14, active: true, turns: [T("AI 티 진단"), T("비녤리 지도로", { d: 1 }), T("전체 지도 시안", { f: ["map.html"] })] },
    ] },
    { name: "빅데이터 과제", color: "#FF6319", chats: [
      { id: "b1", title: "데이터 수집", from: 1, to: 3, turns: [T("공공 API"), T("따릉이 데이터", { d: 1 }), T("수집 코드", { f: ["collect.py"] }), T("결측치", { todo: [["빠진 요청 · 이상치", 0]] })] },
      { id: "b2", title: "모델링", from: 5, to: 9, turns: [T("피처"), T("XGBoost", { d: 1 }), T("노트북", { f: ["model.ipynb"] }), T("튜닝"), T("RMSE 기준", { d: 1 })] },
      { id: "b3", title: "보고서", from: 11, to: 12, turns: [T("목차"), T("본문", { f: ["report.docx"] }), T("그래프", { todo: [["내가 할 일 · 출처 달기", 0]] })] },
    ] },
    { name: "졸업 전시", color: "#00933C", chats: [
      { id: "e1", title: "포스터 컨셉", from: 2, to: 6, turns: [T("레퍼런스"), T("스위스 스타일", { d: 1 }), T("1차 시안", { f: ["poster_v1.ai"] }), T("피드백")] },
      { id: "e2", title: "리플릿", from: 8, to: 10, turns: [T("판형"), T("A5 3단", { d: 1 }), T("조판", { f: ["leaflet.indd"] })] },
      { id: "e3", title: "포스터 수정", from: 12, to: 14, turns: [T("교수님 피드백"), T("제목 크게", { d: 1 }), T("3차 시안", { f: ["poster_v3.ai"], todo: [["내가 할 일 · 인쇄소 예약", 0]] })] },
    ] },
    { name: "토익", color: "#FCCC0A", ink: "#111", chats: [
      { id: "t1", title: "LC 오답", from: 0, to: 1, turns: [T("Part 2"), T("오답 정리", { f: ["오답노트.md"] })] },
      { id: "t2", title: "RC 문법", from: 4, to: 5, turns: [T("관계사"), T("가정법")] },
      { id: "t3", title: "모의고사", from: 9, to: 9, turns: [T("채점"), T("목표 850", { d: 1 })] },
      { id: "t4", title: "단어", from: 13, to: 13, turns: [T("Day 21"), T("Day 22")] },
    ] },
  ],
  // 환승: 실제로 이어진 대화만 (이어 가기 · 지난 대화 참조 · 같은 파일)
  links: [["g1", "g2", "이어 가기"], ["g2", "g3", "이어 가기"], ["e1", "e3", "같은 파일"], ["e1", "g5", "지난 대화 참조"], ["b2", "g3", "지난 대화 참조"]],
};

// 그릴 대화: 가닥 앱(/map)에서 열면 백엔드가 모아 둔 대화(/map/data), ?data=파일.json이면 그 파일,
// ?demo거나 둘 다 없으면 위의 만든 예시. 실제 대화가 하나도 없으면 만든 예시를 보여 줘요
const params = new URLSearchParams(location.search);
const source = params.get("data") || (!params.has("demo") && location.pathname.endsWith("/map") ? "/map/data" : null);
let real = null;
if (source) {
  try { real = await fetch(source, { cache: "no-store" }).then(r => r.ok ? r.json() : null); } catch { real = null; }
}
if (real?.projects?.length) {
  const [y, m, d] = real.start.split("-").map(Number);
  START = new Date(y, m - 1, d); TODAY = real.today; DATA = real;
}

await document.fonts.ready;   // 글자 폭을 재서 자리를 잡으니, 글꼴이 다 온 뒤에 그려요

const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
const days = TODAY + 1;
const dayLabel = d => { const t = new Date(START); t.setDate(t.getDate() + d); return `${t.getMonth() + 1}/${t.getDate()}`; };
const chats = {};   // id → 대화 (번호 · 프로젝트를 붙여 둬요)
for (const p of DATA.projects) p.chats.forEach((c, i) => { c.no = i + 1; c.p = p; chats[c.id] = c; });

// ── 줌 · 이동: 목표 값을 정하면 화면이 부드럽게 따라가요. 전체 지도와 한 줄 노선도가 같이 써요
function zoomable(svg, world, onPaint = () => {}, most = 2.2) {   // most: 화면에 맞출 때 가장 크게
  let view = { x: 0, y: 0, k: 1 }, goal = { ...view }, raf = 0, drag = null, moved = 0;
  const paint = () => { world.setAttribute("transform", `translate(${view.x} ${view.y}) scale(${view.k})`); onPaint(view.k); };
  const tick = () => {
    const e = 0.18;
    view.x += (goal.x - view.x) * e; view.y += (goal.y - view.y) * e; view.k += (goal.k - view.k) * e;
    paint();
    if (Math.abs(goal.k - view.k) > 1e-4 || Math.abs(goal.x - view.x) > 0.1 || Math.abs(goal.y - view.y) > 0.1) raf = requestAnimationFrame(tick);
    else { view = { ...goal }; paint(); raf = 0; }
  };
  const go = () => { if (!raf) raf = requestAnimationFrame(tick); };
  const z = {
    zoomAt(f, mx, my) {
      const k = Math.min(4, Math.max(0.12, goal.k * f));
      goal.x = mx - (mx - goal.x) * (k / goal.k); goal.y = my - (my - goal.y) * (k / goal.k); goal.k = k; go();
    },
    fit(box, pad = 40, now = false, most = 2.2) {
      const r = svg.getBoundingClientRect(), k = Math.min(most, (r.width - pad * 2) / box.width, (r.height - pad * 2) / box.height);
      goal = { k, x: (r.width - box.width * k) / 2 - box.x * k, y: (r.height - box.height * k) / 2 - box.y * k };
      if (now) { view = { ...goal }; paint(); } else go();
    },
    all(now) { z.fit(world.getBBox(), 40, now, most); },
    center() { const r = svg.getBoundingClientRect(); return [r.width / 2, r.height / 2]; },
    // 끌지 않고 눌렀을 때만, 처음 누른 것을 돌려줘요 (끌기 때문에 포인터를 잡아 두면 click의 대상이 svg로 바뀌어요)
    picked: sel => moved < 5 ? down?.closest(sel) : null,
  };
  let down = null;
  svg.addEventListener("wheel", e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    z.zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0018)), e.clientX - r.left, e.clientY - r.top);
  }, { passive: false });
  svg.addEventListener("pointerdown", e => { down = e.target; moved = 0; if (e.target.closest(".title")) return; drag = [e.clientX, e.clientY]; svg.setPointerCapture(e.pointerId); svg.classList.add("drag"); });
  svg.addEventListener("pointermove", e => {
    if (!drag) return;
    const dx = e.clientX - drag[0], dy = e.clientY - drag[1];
    moved += Math.abs(dx) + Math.abs(dy);
    goal.x += dx; goal.y += dy; view.x = goal.x; view.y = goal.y; drag = [e.clientX, e.clientY]; paint();
  });
  const drop = () => { drag = null; svg.classList.remove("drag"); };
  svg.addEventListener("pointerup", drop);
  svg.addEventListener("pointercancel", drop);          // 끌다가 창 밖에서 놓거나 손짓이 끊겨도 끌기 상태가 남지 않게
  svg.addEventListener("lostpointercapture", drop);
  svg.addEventListener("dblclick", e => { const r = svg.getBoundingClientRect(); z.zoomAt(2, e.clientX - r.left, e.clientY - r.top); });
  return z;
}

// ════ 전체 지도 ════
// 계산은 (시간 t, 옆 c)로 하고, 화면에서는 시간이 아래로 흘러요
const DAY = 96, PITCH = 17, LINE = 13, GAP = 270, R0 = 120, SPUR_STEP = 16, SPUR_ROOM = 34, TITLE = 46;
const world = document.getElementById("world"), svg = document.getElementById("map");

// 프로젝트 안에서 겹치지 않는 대화는 같은 줄을 써요 → 묶음이 필요한 만큼만 굵어져요
for (const p of DATA.projects) {
  const ends = [];
  for (const c of [...p.chats].sort((a, b) => a.from - b.from)) {
    let k = ends.findIndex(e => e < c.from);
    if (k < 0) { k = ends.length; ends.push(0); }
    ends[k] = c.to; c.lane = k;
  }
  p.first = Math.min(...p.chats.map(c => c.from));
  p.last = Math.max(...p.chats.map(c => c.to));
  // 그날 열려 있는 줄 수. 일이 몰리면 묶음이 굵어지고, 옆 노선들이 45°로 비켜 가요
  p.h0 = Array.from({ length: days }, (_, d) => 1 + Math.max(0, ...p.chats.filter(c => c.from <= d && d <= c.to).map(c => c.lane)));
}

// ── 선 다루기
const sub = (a, b) => [a[0] - b[0], a[1] - b[1]], len = v => Math.hypot(v[0], v[1]);
const unit = (a, b) => { const v = sub(b, a), l = len(v); return [v[0] / l, v[1] / l]; };
function clean(P) {   // 겹친 점 · 한 줄 위의 가운데 점을 빼요
  const out = [];
  for (const p of P) if (!out.length || len(sub(p, out[out.length - 1])) > 0.01) out.push(p);
  return out.filter((p, i) => {
    if (i === 0 || i === out.length - 1) return true;
    const a = unit(out[i - 1], p), b = unit(p, out[i + 1]);
    return Math.abs(a[0] - b[0]) > 1e-6 || Math.abs(a[1] - b[1]) > 1e-6;
  });
}
function offset(P, o) {   // 나란한 줄: 진행 방향 옆으로 o만큼, 꺾이는 곳은 맞춰서
  return P.map((p, i) => {
    const a = i > 0 && unit(P[i - 1], p), b = i < P.length - 1 && unit(p, P[i + 1]);
    const n1 = a && [-a[1], a[0]], n2 = b && [-b[1], b[0]];
    let m = !n1 ? n2 : !n2 ? n1 : null;
    if (!m) { const c = n1[0] * n2[0] + n1[1] * n2[1]; m = [(n1[0] + n2[0]) / (1 + c), (n1[1] + n2[1]) / (1 + c)]; }
    return [p[0] + m[0] * o, p[1] + m[1] * o];
  });
}
function clip(P, t0, t1) {
  const out = [];
  for (let i = 0; i < P.length - 1; i++) {
    const a = P[i], b = P[i + 1];
    if (b[0] < t0 || a[0] > t1) continue;
    const at = t => [t, a[1] + (b[1] - a[1]) * (t - a[0]) / (b[0] - a[0])];
    out.push(at(Math.max(t0, a[0])), at(Math.min(t1, b[0])));
  }
  return clean(out);
}
function rounded(P, o, r0 = R0) {   // 비녤리의 둥근 꺾임. 안쪽 줄은 작은 반지름, 바깥 줄은 큰 반지름 → 같은 중심의 호
  const f = p => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
  let d = `M${f(P[0])}`;
  for (let i = 1; i < P.length - 1; i++) {
    const u1 = unit(P[i - 1], P[i]), u2 = unit(P[i], P[i + 1]);
    const cross = u1[0] * u2[1] - u1[1] * u2[0];
    const th = Math.acos(Math.max(-1, Math.min(1, u1[0] * u2[0] + u1[1] * u2[1]))), t = Math.tan(th / 2);
    let R = r0 - Math.sign(cross) * o, cut = R * t;
    const lim = Math.min(len(sub(P[i], P[i - 1])), len(sub(P[i + 1], P[i]))) / 2;
    if (cut > lim) { cut = lim; R = cut / t; }
    d += ` L${f([P[i][0] - u1[0] * cut, P[i][1] - u1[1] * cut])} A${R.toFixed(1)} ${R.toFixed(1)} 0 0 ${cross > 0 ? 1 : 0} ${f([P[i][0] + u2[0] * cut, P[i][1] + u2[1] * cut])}`;
  }
  return d + ` L${f(P[P.length - 1])}`;
}
function pointAt(path, t) {   // 둥근 꺾임 위에서도 역이 선에 정확히 앉도록
  let lo = 0, hi = path.getTotalLength();
  for (let i = 0; i < 32; i++) { const m = (lo + hi) / 2; if (path.getPointAtLength(m).x < t) lo = m; else hi = m; }
  const p = path.getPointAtLength(lo); return [p.x, p.y];
}
const cAt = (P, t) => { for (let i = 0; i < P.length - 1; i++) if (P[i + 1][0] >= t) { const [a, b] = [P[i], P[i + 1]]; return a[1] + (b[1] - a[1]) * (t - a[0]) / (b[0] - a[0]); } return P[P.length - 1][1]; };
// 가로(기본): 시간이 오른쪽으로, 수업이 위아래로 쌓여요. 세로: 시간이 아래로
const HORIZ = true;   // 가로로 고정 (세로 배치 코드는 남아 있지만 쓰지 않아요)
const S = p => HORIZ ? [p[0], p[1]] : [p[1], p[0]];   // (시간, 옆) → 화면 (x, y)

// ── 배치: 시간 그대로. 대화가 있던 날은 모두 같은 폭, 대화가 없던 날들은 한데 접어 ‘며칠 쉼’ 한 칸으로 줄여요
let order = DATA.projects, dayH = [], Ty = () => 0, edge = () => 0, ROW = 0;   // ROW: 한 줄(노선 자리)의 폭
const dayAt = t => { let d = 0; while (d < TODAY && Ty(d + 1) <= t) d++; return d; };
const FOLD = 56;   // 접힌 쉼 구간 한 칸의 폭 (‘13일 쉼’이 다음 날짜와 겹치지 않게)

// 그날의 턴 수: 턴마다 날짜가 있으면(실제 대화) 그대로 세고, 없으면(만든 예시) 대화 기간에 고르게 나눠요
const turnsOn = (c, d) => c.turns[0]?.day !== undefined ? c.turns.filter(u => u.day === d).length
  : c.from <= d && d <= c.to ? c.turns.length / (c.to - c.from + 1) : 0;

function layout() {
  const busy = Array.from({ length: days }, (_, d) => d === TODAY || DATA.projects.some(p => p.chats.some(c => turnsOn(c, d) > 0)));
  // 쉼 구간은 첫날만 FOLD 폭, 나머지 날은 0 (같은 자리로 접혀요)
  // 대화가 있던 날은 같은 폭(DAY)이 기본이고, 한 대화가 그날 턴을 많이 했으면 역이 26px씩 떨어지게 넓혀요 (날짜 순서는 그대로)
  const crowd = d => Math.max(0, ...DATA.projects.flatMap(p => p.chats.map(c => turnsOn(c, d))));
  dayH = busy.map((b, d) => b ? Math.max(DAY, 40 + 26 * crowd(d)) : d > 0 && !busy[d - 1] ? 0 : FOLD);
  // 쉬는 날에는 묶음 굵기를 앞의 바쁜 날 그대로 이어 가요 (접힌 칸 안에서 노선이 꺾이지 않게)
  for (const p of DATA.projects) {
    p.h = [];
    p.h0.forEach((h, d) => p.h.push(busy[d] || d === 0 ? h : p.h[d - 1]));
  }
  // 프로젝트 이름이 길면 그만큼 옆 노선과 띄워요 (세로일 때는 이름을 띄어쓰기마다 줄을 바꾸니 가장 긴 낱말 기준)
  for (const p of order) p.gap = HORIZ ? 270 : Math.max(GAP, Math.max(...p.name.split(" ").map(w => w.length)) * TITLE * 0.98 + 60);
  Ty = d => { let t = 0; for (let k = 0; k < d; k++) t += dayH[k]; return t; };
  // 노선은 첫 대화에서 시작해요. 그래서 끝난 수업의 줄은 나중에 시작하는 수업이 이어받아요 (동시에 달린 노선만 나란히)
  // 줄마다 차지한 구간은 화면 길이로 재고, 가로일 때는 노선 머리 앞의 이름 길이까지 쳐요
  const span = p => {
    const a = Ty(p.first) - 90, name = HORIZ ? p.name.length * TITLE * 0.95 + 40 : 0;
    return [a, Math.max(Ty(p.last + 1), a + name)];
  };
  const taken = [], slot = new Map();
  for (const p of [...order].sort((a, b) => a.first - b.first)) {
    const [a, b] = span(p);
    let k = taken.findIndex(spans => spans.every(([x, y]) => b + 30 < x || a > y + 30));
    if (k < 0) { k = taken.length; taken.push([]); }
    taken[k].push([a, b]); slot.set(p, k);
  }
  const width = Math.max(...order.map(q => Math.max(...q.h) * PITCH + q.gap));
  ROW = width;
  edge = pi => (slot.get(order[pi]) ?? taken.length) * width;
  return busy;
}

const mapZ = zoomable(svg, world, k => {
  // 멀리서 볼수록 노선을 굵게: 한 학기를 한 화면에 넣어도 포스터처럼 읽히게 (나란한 노선은 한 묶음으로 합쳐 보여요)
  svg.style.setProperty("--thick", Math.max(1, Math.min(4, 0.45 / k)).toFixed(2));
  svg.classList.toggle("far", k < 0.38);
  svg.classList.toggle("mid", k >= 0.38 && k < 0.85);
}, 1);   // 전체 지도는 실제 크기보다 키워서 맞추지 않아요 (대화가 적어도 제목이 거대해지지 않게)

function drawMap() {
  // 비녤리: 노선을 굵게(20), 나란한 노선 사이는 3px 흰 틈만
  svg.style.setProperty("--line", `${LINE}px`);
  const busy = layout();
  world.replaceChildren();
  // ── 그리기: 격자 → 노선 → 환승 → 글자 순으로 겹쳐요. 세로일 때는 노선 층의 축을 바꿔서 시간이 아래로 흐르게
  const grid = el("g", { class: "grid" }, world), swap = HORIZ ? {} : { transform: "matrix(0 1 1 0 0 0)" };
  const routes = el("g", swap, world), xg = el("g", swap, world), labels = el("g", {}, world);
  const right = Math.max(...Array.from({ length: days }, (_, d) => edge(order.length, d)));
  const [rx, ry] = S([Ty(TODAY), -120]), [rw, rh] = S([dayH[TODAY], right + 120]);
  el("rect", { x: rx, y: ry, width: rw, height: rh }, grid);
  for (let d = 0; d < days; d++) {
    const [x1, y1] = S([Ty(d), -120]), [x2, y2] = S([Ty(d), right]);
    el("line", { x1, y1, x2, y2 }, grid);
    if (!dayH[d]) continue;
    // 쉼 구간은 ‘n일 쉼’ 한 칸으로 요약해요
    let label = d === TODAY ? "오늘" : dayLabel(d), cls = d === TODAY ? "now" : "";
    if (!busy[d]) { let n = 1; while (d + n < days && !busy[d + n]) n++; label = `${n}일 쉼`; cls = "rest"; }
    const at = HORIZ ? { x: Ty(d) + 6, y: -100 } : { x: -40, y: Ty(d) + 22, "text-anchor": "end" };
    el("text", { ...at, class: cls }, grid).textContent = label;
  }

  order.forEach((p, pi) => {
    const g = el("g", { class: "proj", "data-p": pi }, routes);
    const lab = el("g", { class: "proj lbl", "data-p": pi }, labels);
    // 묶음의 바깥선: 그날 묶음 굵기가 바뀌거나 ‘오늘’로 모여드는 곳에서 45°로 비켜요
    const head = Ty(p.first) - 70, d0 = p.first;   // 노선 머리 (이름이 붙는 곳): 첫 대화 바로 앞
    const band = [[head, edge(pi, d0)]];
    for (let d = d0; d < TODAY; d++) {
      const c = edge(pi, d), next = edge(pi, d + 1), dc = Math.abs(next - c);
      const b = Ty(d + 1);
      if (dc) band.push([b - dc / 2, c], [b + dc / 2, next]);
    }
    band.push([Ty(TODAY) + dayH[TODAY] + 60, edge(pi, TODAY)]);
    const B = clean(band), spine = offset(B, LINE / 2);
    const t0 = Ty(p.first) + 14, t1 = Ty(p.last) + dayH[p.last] - 14;

    // 프로젝트 이름 — 포스터처럼 크게. 세로일 때는 띄어쓰기마다 줄을 바꿔 쌓아요 (비녤리 지도의 ‘Times Sq / 42 St’처럼)
    const [hx, hy] = S([head, edge(pi, d0) + LINE / 2]);
    const words = HORIZ ? [p.name] : p.name.split(" ");
    const [nx, ny] = HORIZ ? [hx - 14, hy - 30] : [hx - LINE / 2 - 6, hy - 36 - (words.length - 1) * TITLE * 0.96];
    const title = el("text", { x: nx, y: ny, class: "title", "font-size": TITLE, "data-p": pi }, labels);
    words.forEach((w, i) => { el("tspan", { x: nx, dy: i ? TITLE * 0.96 : 0 }, title).textContent = w; });
    el("circle", { cx: hx, cy: hy, r: 14, fill: p.color }, labels);
    // 아직 시작하지 않은 구간은 가는 선으로 이름과 이어 줘요
    el("path", { d: rounded(clip(spine, head, t0), LINE / 2), stroke: p.color, "stroke-width": 2, "stroke-opacity": .45, fill: "none" }, g);
    // 프로젝트의 등뼈: 처음부터 마지막 대화까지
    p.spine = el("path", { d: rounded(clip(spine, t0, t1), LINE / 2), stroke: p.color, "stroke-width": 4, fill: "none" }, g);
    p.t1 = t1;

    // 역 이름은 묶음 오른쪽에 가로로. 위아래로 겹치면 아래로 밀어요
    const tags = [];
    const rim = t => cAt(B, t) + p.h[dayAt(t)] * PITCH;   // 그 시각 묶음의 바깥 가장자리
    const outside = t => rim(t) + 12 + SPUR_ROOM;
    p.chats.forEach(c => {
      const o = c.lane * PITCH + LINE / 2, ts = Ty(c.from) + 14, te = Ty(c.to) + dayH[c.to] - 14;
      const d = rounded(clip(offset(B, o), ts, te), o);
      const path = el("path", { d, stroke: p.color, "stroke-width": LINE, fill: "none", "data-chat": c.id, class: "route" }, g);
      el("path", { d, stroke: "transparent", "stroke-width": 36, fill: "none", "data-chat": c.id }, g);   // 멀리서도 누르기 쉽게
      // 노선 번호 (비녤리 지도의 A · C · E 같은 것)
      const s = pointAt(path, ts);
      el("circle", { cx: s[0], cy: s[1], r: 11, fill: p.color, stroke: "var(--paper)", "stroke-width": 2.5, "data-chat": c.id }, g);
      const [bx, by] = S(s);
      el("text", { x: bx, y: by + 4, "text-anchor": "middle", class: "bullet", style: `fill:${p.ink || "#fff"}`, "data-chat": c.id }, lab).textContent = c.no;
      tags.push({ t: ts, cls: "chat", text: c.title, chat: c.id });
      const n = c.turns.length, step = n > 1 ? (te - ts - 34) / (n - 1) : 0;
      // 날짜가 있는 턴은 그날 칸 안에 고르게 (그날 몇 번째인지로)
      const seen = {}, count = {};
      for (const u of c.turns) if (u.day !== undefined) count[u.day] = (count[u.day] || 0) + 1;
      const when = (u, i) => u.day === undefined ? ts + 28 + i * step
        : Ty(u.day) + 14 + ((seen[u.day] = (seen[u.day] || 0) + 1) - 0.5) / count[u.day] * (dayH[u.day] - 28);
      c.at = { path, te, times: [] };
      const main = [];   // 턴마다 본선 위의 자리 (곁길 지선이 갈라지고 돌아오는 곳)
      c.turns.forEach((u, i) => {
        const t = when(u, i);
        main.push(pointAt(path, t));
        // 곁길 역은 본선을 떠나 묶음 바깥으로 비켜난 지선 위에 앉아요. 한 단계 깊을 때마다 한 칸 더
        const [pt, pc] = u.side ? [t, rim(t) + 10 + (u.side - 1) * SPUR_STEP] : main[i];
        const now = c.active && i === n - 1;
        if (now) {
          el("circle", { cx: pt, cy: pc, r: 13, class: "now-ring" }, g); el("circle", { cx: pt, cy: pc, r: 7, class: "now-dot" }, g);
          // 지금 있는 역을 위에서 가리키는 굵은 검은 화살표 (비녤리 포스터의 화살표처럼). 멀리서도 ‘지금’이 바로 보여요
          // 오른쪽 아래에서 45°로: 그 역의 이름(45°)과 나란해서 글씨를 덮지 않아요
          el("path", { d: `M${pt + 74} ${pc + 74} L${pt + 17} ${pc + 17}`, class: "here", "marker-end": "url(#arrow)" }, g);
        }
        else if (u.side) el("circle", { cx: pt, cy: pc, r: 4.5, class: "mst-side minor-dot" }, g);   // 곁길 역은 가까이서만
        else el("circle", { cx: pt, cy: pc, r: u.d ? 5.5 : 3, class: u.d ? "dot" : "dot minor-dot" }, g);
        tags.push({ t, cls: now || u.d ? "dec" : u.f.length ? "" : "minor", text: now ? `지금 · ${u.t}` : u.t });
        c.at.times.push([pt, pc]);
      });
      // 곁길 지선: 앞 본선 역에서 갈라져 곁길 역들을 지나고, 본선 질문이 다시 오면 돌아와요. 안 돌아오면 막다른 지선
      for (let a = 0; a < n; a++) {
        if (!c.turns[a].side || (a && c.turns[a - 1].side)) continue;
        let b = a;
        while (b + 1 < n && c.turns[b + 1].side) b++;
        const pts = [a ? main[a - 1] : main[a]];
        for (let i = a; i <= b; i++) pts.push(c.at.times[i]);
        const back = b + 1 < n, end = c.at.times[b];
        pts.push(back ? main[b + 1] : [end[0] + 20, end[1]]);
        const P = [pts[0]];   // 옆으로 비킬 때마다 두 역 사이 가운데에서 45°로 (자리가 모자라면 조금 가파르게)
        for (let k = 1; k < pts.length; k++) {
          const [pt, pc] = pts[k - 1], [qt, qc] = pts[k], dc = Math.abs(qc - pc), dt = Math.min(dc, (qt - pt) * 0.8), m = (pt + qt) / 2;
          if (dc > 0.5) P.push([m - dt / 2, pc], [m + dt / 2, qc]);
          P.push([qt, qc]);
        }
        g.insertBefore(el("path", { d: rounded(clean(P), 0, 10), class: "mspur" }, g), g.firstChild);   // 다른 노선 밑으로 지나가요
        if (!back) { const [et, ec] = P[P.length - 1]; el("line", { x1: et, y1: ec - 7, x2: et, y2: ec + 7, class: "mspur-end" }, g); }
      }
    });
    tags.sort((a, b) => a.t - b.t);
    // 세로: 묶음 오른쪽에 가로 글씨, 위아래 간격으로 겹침을 막아요
    // 가로: 묶음 아래에 45°로 (열차 안 노선도처럼). 45° 글씨끼리는 x − y가 같으면 한 줄 위라서, 그 값(대각선에 수직인 거리)으로 띄워요
    const size = c => c === "chat" ? 18 : c === "minor" ? 13 : 14;
    let floor = -Infinity, last = 14;
    for (const g of tags) {
      let x, y, shift;
      if (HORIZ) {
        y = outside(g.t);
        const gap = ((last + size(g.cls)) / 2 + 8) * Math.SQRT2;   // 줄 사이 8px: 한글이 위아래로 꽉 차는 글꼴(Pretendard)에서도 줄끼리 닿지 않게
        x = Math.max(g.t + 4, floor + gap + y);
        shift = x - (g.t + 4);
      } else {
        x = outside(g.t);
        y = Math.max(g.t + 5, floor + (g.cls === "chat" ? 22 : 17));
        shift = y - (g.t + 5);
      }
      // 자리가 없으면 이름을 빼요(대화 이름은 남겨요). 역과 이름이 멀어지면 틀린 지도예요. 빠진 이름은 한 줄 노선도에 다 있어요
      if (g.cls !== "chat" && shift > (g.cls === "minor" ? 30 : 48)) continue;
      floor = HORIZ ? x - y : y; last = size(g.cls);
      const e = el("text", { x, y, class: g.cls, ...(HORIZ ? { transform: `rotate(45 ${x} ${y})` } : {}) }, lab);
      // 가로일 때 긴 이름은 줄여요: 45°로 내려가다 아래 줄의 이름 · 노선에 닿기 전에 끊어요 (전체 이름은 마우스를 올리면)
      const fit = HORIZ ? Math.max(4, Math.min(14, Math.floor((edge(pi) + ROW - 80 - y) / (Math.SQRT1_2 * size(g.cls))))) : Infinity;
      const long = g.text.length > fit;
      e.textContent = long ? g.text.slice(0, fit - 1) + "…" : g.text;
      if (long) el("title", {}, e).textContent = g.text;
      if (g.chat) e.dataset.chat = g.chat;
    }
    const thick = Math.max(...p.h) * PITCH;
    p.box = HORIZ ? { x: head - 40, y: edge(pi, d0) - 120, width: t1 - head + 200, height: thick + 320 }
      : { x: hx - 40, y: head - 110, width: thick + GAP, height: t1 - head + 150 };
  });

  // 환승: 이어진 두 대화를 검은 막대로 (비녤리 지도의 환승 통로처럼)
  for (const [a, b, why] of DATA.links) {
    const A = chats[a].at, q = chats[b].at.times[0], P = chats[a].p;
    // 새 대화가 열린 그 시각에 옆으로 한 줄: 앞 대화가 달리고 있으면 그 노선에서, 끝났으면 그 프로젝트의 등뼈에서
    const p = q[0] <= A.te ? pointAt(A.path, q[0]) : q[0] <= P.t1 ? pointAt(P.spine, q[0]) : A.times[A.times.length - 1];
    // 앞 대화에서 새 대화로 가는 굵은 검은 화살표. 화살촉이 도착 역의 점을 덮지 않게 조금 앞에서 멈춰요
    const flat = Math.abs(p[0] - q[0]) < 1, stop = 13;
    const d = flat ? `M${p[0]} ${p[1]} V${q[1] + (q[1] > p[1] ? -stop : stop)}` : `M${p[0]} ${p[1]} V${q[1]} H${q[0] - stop}`;
    // 화살촉은 막대가 충분히 길 때만 (바로 옆 줄로 이어지는 짧은 환승은 막대와 두 점이면 충분해요)
    const long = flat ? Math.abs(q[1] - p[1]) > 36 : true;
    el("path", long ? { d, class: "xfer", "marker-end": "url(#arrow)" } : { d: `M${p[0]} ${p[1]} V${q[1]} H${q[0]}`, class: "xfer" }, xg);
    for (const s of [p, q]) el("circle", { cx: s[0], cy: s[1], r: 6.5, class: "dot" }, xg);
    const [lx, ly] = S([p[0], (p[1] + q[1]) / 2]);
    el("text", HORIZ ? { x: lx + 8, y: ly + 4, class: "xfer-lbl" } : { x: lx, y: ly - 10, "text-anchor": "middle", class: "xfer-lbl" }, labels).textContent = why;
  }

  // 프로젝트 이름: 올리면 그 노선만 또렷하게, 누르면 그 프로젝트로 날아가요
  for (const t of labels.querySelectorAll(".title")) {
    const pi = t.dataset.p, mine = () => [...world.querySelectorAll(`.proj[data-p="${pi}"]`)];
    t.addEventListener("pointerenter", () => { world.classList.add("dim"); mine().forEach(g => g.classList.add("hot")); });
    t.addEventListener("pointerleave", () => { world.classList.remove("dim"); mine().forEach(g => g.classList.remove("hot")); });
    t.addEventListener("click", () => mapZ.fit(order[pi].box));
  }
}

// ════ 포스터 ════
// 같은 대화를 비녤리 포스터처럼. 같은 날 함께 달린 프로젝트는 흰 틈 하나만 두고 붙어 달리고, 쉬면 벌어져요(45°).
// 그날 가장 많이 이야기한 프로젝트가 맨 위로 올라가요. 관심이 옮겨 가면 노선끼리 엇갈려요 (프로젝트끼리 이어진 대화가 없어도 흐름이 보이게)
// 중간에 시작한 프로젝트는 위나 아래 가장자리에서 들어와 90°로 꺾이고, 끝난 프로젝트는 꺾여 나가요. 오늘까지 달리는 노선은 오른쪽 끝을 뚫고 나가요
const PL = 22, PG = 5, PP = PL + PG, PMIN = 1700, PFOLD = 40, PAIR = 120, PR = 70, PTOP = 360, PBOT = 280, PM = 120;
const psvg = document.getElementById("poster"), pworld = document.getElementById("pworld");
const posterZ = zoomable(psvg, pworld, () => {}, 2);
let posterDrawn = false;

function drawPoster() {
  posterDrawn = true;
  pworld.replaceChildren();
  const busy = Array.from({ length: days }, (_, d) => d === TODAY || DATA.projects.some(p => p.chats.some(c => turnsOn(c, d) > 0)));
  // 날이 적어도 포스터 폭은 그대로: 하루 폭을 늘려요 (45° 꺾임이 들어갈 자리도 생겨요)
  const PDAY = Math.max(104, Math.ceil(PMIN / busy.filter(Boolean).length));
  const w = busy.map((b, d) => b ? PDAY : d > 0 && !busy[d - 1] ? 0 : PFOLD);
  // 오래 달린 프로젝트가 맨 위에서 곧게 (등뼈), 나머지가 그 아래로 붙었다 벌어졌다 해요
  const daysRun = p => busy.filter((b, d) => p.chats.some(c => c.from <= d && d <= c.to)).length;
  const P = [...DATA.projects].sort((a, b) => daysRun(b) - daysRun(a)), n = P.length;
  const T0 = d => { let t = 0; for (let k = 0; k < d; k++) t += w[k]; return t; };
  // 그날 달렸나: 대화가 걸쳐 있으면. 하루 빈 날은 메우고(하루 만에 벌어졌다 붙지 않게), 접힌 쉼 구간은 앞날 그대로
  const run = P.map(p => {
    const a = Array.from({ length: days }, (_, d) => p.chats.some(c => c.from <= d && d <= c.to));
    for (let d = 1; d < days - 1; d++) if (!a[d] && a[d - 1] && a[d + 1]) a[d] = true;
    for (let d = 1; d < days; d++) if (!busy[d]) a[d] = a[d - 1];
    return a;
  });
  const lanes = P.map(p => 1 + Math.max(...p.chats.map(c => c.lane)));
  // 그날의 순서: 달린 프로젝트가 위, 그중 그날 턴이 가장 많은 프로젝트가 맨 위. 나머지는 앞날 순서 그대로 (괜히 뒤섞이지 않게)
  const vol = (i, d) => P[i].chats.reduce((s, c) => s + turnsOn(c, d), 0);
  const alive = (i, d) => P[i].first <= d && d <= P[i].last;
  let prev = P.map((_, i) => i), cross = 0;
  const pos = [], rank = [];
  for (let d = 0; d < days; d++) {
    const act = prev.filter(i => run[i][d]);
    if (busy[d] && act.length) {
      const head = act.reduce((a, i) => vol(i, d) > vol(a, d) ? i : a);
      prev = [head, ...act.filter(i => i !== head), ...prev.filter(i => !run[i][d])];
    }
    // 위에서부터 쌓아요. 둘 다 달린 이웃 사이는 흰 틈만, 아니면 넓게. 아직 시작 안 했거나 끝난 프로젝트는 자리를 차지하지 않아요
    const ord = prev.filter(i => alive(i, d)), at = [], r = [];
    let y = 0;
    ord.forEach((i, k) => { at[i] = y; r[i] = k / Math.max(1, ord.length - 1); const j = ord[k + 1]; y += lanes[i] * PP + (j !== undefined && run[i][d] && run[j][d] ? 0 : PAIR - PG); });
    pos.push(at); rank.push(r); cross = Math.max(cross, y);
  }
  const L = -PM, R = T0(days) + PM, top = -PTOP, bot = cross + PBOT;
  const frame = el("clipPath", { id: "pframe" }, el("defs", {}, pworld));
  el("rect", { x: L, y: top, width: R - L, height: bot - top }, frame);
  el("rect", { x: L, y: top, width: R - L, height: bot - top, class: "p-paper" }, pworld);
  const lines = el("g", { "clip-path": "url(#pframe)" }, pworld), marks = el("g", {}, pworld);
  const block = { top: [], bot: [] };   // 가장자리로 드나드는 선이 지나는 곳 (제목 · 견본을 피해 두려고)

  P.forEach((p, i) => {
    const g = el("g", {}, lines), cg = el("g", {}, g), lg = el("g", {}, g);
    const draw = d => { el("path", { d, class: "p-case" }, cg); return el("path", { d, stroke: p.color, class: "p-line" }, lg); };
    const dA = p.first, dB = p.last, going = dB === TODAY;
    // 위쪽에 있던 노선은 위 가장자리로, 아래쪽은 아래 가장자리로 드나들어요
    const sideA = rank[dA][i] < 0.5 ? "top" : "bot", sideB = rank[dB][i] < 0.5 ? "top" : "bot", edge = sd => sd === "top" ? top - 40 : bot + 40;
    const tA = dA ? T0(dA) + 30 : L - 40, tB = going ? R + 40 : T0(dB) + w[dB] - 30;
    const band = [[tA, pos[dA][i]]];
    for (let d = dA; d < dB; d++) {
      const c = pos[d][i], next = pos[d + 1][i], dc = Math.abs(next - c);
      if (dc) { const b = T0(d + 1), dt = Math.min(dc, PDAY * 0.8); band.push([b - dt / 2, c], [b + dt / 2, next]); }
    }
    band.push([tB, pos[dB][i]]);
    const B = clean(band), wide = lanes[i] * PP;
    if (dA) block[sideA].push([tA - wide, tA + wide]);
    if (!going) block[sideB].push([tB - wide, tB + wide]);
    const full = clean([...(dA ? [[tA, edge(sideA)]] : []), ...B, ...(going ? [] : [[tB, edge(sideB)]])]);
    p.pmain = draw(rounded(offset(full, PL / 2), PL / 2, PR));
    p.pt1 = tB;
    p.chats.forEach(c => {
      const o = c.lane * PP + PL / 2, ts = T0(c.from) + 14, te = T0(c.to) + w[c.to] - 14;
      const path = c.lane ? draw(rounded(clip(offset(B, o), ts, te), o, PR)) : p.pmain;
      const n = c.turns.length, step = n > 1 ? (te - ts - 34) / (n - 1) : 0, seen = {}, count = {};
      for (const u of c.turns) if (u.day !== undefined) count[u.day] = (count[u.day] || 0) + 1;
      const when = (u, k) => u.day === undefined ? ts + 17 + k * step
        : T0(u.day) + 14 + ((seen[u.day] = (seen[u.day] || 0) + 1) - 0.5) / count[u.day] * (w[u.day] - 28);
      c.pp = { path, te, times: c.turns.map((u, k) => pointAt(path, when(u, k))) };
      c.turns.forEach((u, k) => {
        const [x, y] = c.pp.times[k];
        if (c.active && k === n - 1) {
          el("circle", { cx: x, cy: y, r: 18, class: "now-ring" }, marks); el("circle", { cx: x, cy: y, r: 10, class: "now-dot" }, marks);
          // 비녤리 포스터의 굵은 검은 화살표가 지금 있는 역을 가리켜요
          // 오른쪽에 이름이 들어갈 자리가 없으면 왼쪽 아래에서
          const tag = el("text", { y: y + 178, class: "p-now" }, marks);
          tag.textContent = `지금 · ${u.t}`;
          const s = x + 182 + tag.getComputedTextLength() > R - 30 ? -1 : 1;
          tag.setAttribute("x", x + s * 182); tag.setAttribute("text-anchor", s > 0 ? "start" : "end");
          el("path", { d: `M${x + s * 170} ${y + 170} L${x + s * 26} ${y + 26}`, class: "p-here", "marker-end": "url(#parrow)" }, marks);
        } else if (u.d) el("circle", { cx: x, cy: y, r: 6.5, class: "dot" }, marks);
      });
    });
  });

  // 환승: 새 대화가 열린 그 시각에, 앞 대화(끝났으면 그 프로젝트 노선)에서 검은 막대 하나와 두 점
  for (const [a, b] of DATA.links) {
    const A = chats[a], q = chats[b].pp.times[0];
    const p = q[0] <= A.pp.te ? pointAt(A.pp.path, q[0]) : q[0] <= A.p.pt1 ? pointAt(A.p.pmain, q[0]) : A.pp.times.at(-1);
    el("path", { d: `M${p[0]} ${p[1]} V${q[1]} H${q[0]}`, class: "xfer" }, marks);
    for (const s of [p, q]) el("circle", { cx: s[0], cy: s[1], r: 7, class: "dot" }, marks);
  }

  // 제목과 프로젝트 색 견본: 가장자리로 드나드는 선을 피해 빈 곳에
  const spot = (sides, wid) => {
    for (const s of sides) for (let x = R - 60 - wid; x >= L + 60; x -= 40)
      if (block[s].every(([a, b]) => b < x - 50 || a > x + wid + 50)) { block[s].push([x, x + wid]); return [s, x]; }
    return [sides[0], R - 60 - wid];
  };
  const decs = P.reduce((s, p) => s + p.chats.reduce((t, c) => t + c.turns.filter(u => u.d).length, 0), 0);
  // 제목: 비녤리 포스터처럼 한 줄로 크게 ‘가닥 GADAK’ (로마자는 헬베티카)
  const title = el("text", { "text-anchor": "end", class: "p-title" }, marks);
  title.textContent = "가닥 "; el("tspan", { class: "p-latin" }, title).textContent = "GADAK";
  const tw = title.getComputedTextLength();
  const [ts, tx] = spot(["top", "bot"], tw), ty = ts === "top" ? top + 190 : bot - 70;
  title.setAttribute("x", tx + tw); title.setAttribute("y", ty);
  el("text", { x: tx + tw, y: ty + 48, "text-anchor": "end", class: "p-sub" }, marks).textContent =
    `${dayLabel(0)} – 오늘 · 프로젝트 ${n} · 대화 ${Object.keys(chats).length} · 정함 ${decs}`;
  // 견본 칸 폭은 이름 길이대로
  const names = P.map(p => { const t = el("text", { "text-anchor": "middle", class: "p-name" }, marks); t.textContent = p.name; return t; });
  const cell = names.map(t => Math.max(110, t.getComputedTextLength() + 40));
  const [ks, kx] = spot(["bot", "top"], cell.reduce((a, b) => a + b, 0)), ky = ks === "top" ? top + 90 : bot - 130;
  let cx = kx;
  P.forEach((p, i) => {
    const x = cx + cell[i] / 2; cx += cell[i];
    el("circle", { cx: x, cy: ky, r: 30, fill: p.color }, marks);
    names[i].setAttribute("x", x); names[i].setAttribute("y", ky + 70);
  });
}
function togglePoster(on) {
  document.body.classList.toggle("poster-on", on);
  document.getElementById("poster-btn").textContent = on ? "지도로 보기" : "포스터로 보기";
  if (on && !posterDrawn) drawPoster();
  cur().all(true);
  const q = new URLSearchParams(location.search); on ? q.set("poster", "") : q.delete("poster"); history.replaceState(null, "", `?${q}`);
}
document.getElementById("poster-btn").onclick = () => togglePoster(!document.body.classList.contains("poster-on"));

// ════ 한 줄 노선도 ════
// 열차 안 노선도처럼: 굵은 막대 하나, 역마다 점, 이름은 45°, 역 아래에 환승 · 산출물 · 할 일을 쌓아요
const ssvg = document.getElementById("strip"), sworld = document.getElementById("sworld");
const stripZ = zoomable(ssvg, sworld);
const STEP = 76, BAR = 24, STACK = 28, SHOW = 3, DROP = 64;

function openStrip(id) {
  const c = chats[id], p = c.p, n = c.turns.length;
  shown = id;
  document.getElementById("open").hidden = !p.id;   // 만든 예시는 열 대화가 없어요
  sworld.replaceChildren();
  const G = el("g", {}, sworld);
  // 곁길은 본선 아래로 갈라지는 지선이에요. 깊이만큼 내려가고, 내려가고 올라오는 45° 구간만큼 역 사이를 벌려요
  const depth = c.turns.map(u => u.side || 0), X = [0];
  for (let i = 1; i < n; i++) X.push(X[i - 1] + STEP + Math.abs(depth[i] - depth[i - 1]) * DROP);
  const x0 = -STEP * 0.7, x1 = X[n - 1] + STEP * 0.7;

  // 대화 이름과 날짜
  el("circle", { cx: x0 + 12, cy: -281, r: 13, fill: p.color }, G);   // 노선 색 동그라미 (비녤리 포스터의 색 견본처럼)
  el("text", { x: x0 + 34, y: -274, class: "st-sub" }, G).textContent = `${p.name} · ${c.from === c.to ? dayLabel(c.from) : `${dayLabel(c.from)} – ${c.to === TODAY ? "오늘" : dayLabel(c.to)}`}`;
  el("text", { x: x0, y: -226, class: "st-title" }, G).textContent = c.title;

  // 지선: 본선의 앞 역에서 빠져 나가 곁길 역들을 지나고, 본선이 다시 이어지면 돌아와요. 끝내 안 돌아오면 막다른 지선
  for (let a = 0; a < n; a++) {
    if (!depth[a] || (a && depth[a - 1])) continue;
    let b = a;
    while (b + 1 < n && depth[b + 1]) b++;
    const pts = [[a ? X[a - 1] : x0, 0]];
    for (let i = a; i <= b; i++) pts.push([X[i], depth[i] * DROP]);
    const back = b + 1 < n;
    pts.push(back ? [X[b + 1], 0] : [X[b] + STEP * 0.5, depth[b] * DROP]);
    const P = [pts[0]];   // 높이가 바뀌는 곳마다 두 역 사이 가운데에서 45°로
    for (let k = 1; k < pts.length; k++) {
      const [px, py] = pts[k - 1], [qx, qy] = pts[k], dy = Math.abs(qy - py), m = (px + qx) / 2;
      if (dy) P.push([m - dy / 2, py], [m + dy / 2, qy]);
      P.push([qx, qy]);
    }
    el("path", { d: rounded(clean(P), 0, 26), class: "spur" }, G);
    if (!back) { const [ex, ey] = P[P.length - 1]; el("line", { x1: ex, y1: ey - 13, x2: ex, y2: ey + 13, class: "spur-end" }, G); }
  }

  // 막대와 양 끝의 노선 번호 (원본의 E … E)
  el("rect", { x: x0, y: -BAR / 2, width: x1 - x0, height: BAR, fill: p.color }, G);
  el("text", { x: x0 - 14, y: 14, "text-anchor": "end", class: "st-end" }, G).textContent = c.no;
  el("text", { x: x1 + 14, y: 14, class: "st-end" }, G).textContent = c.no;

  // 이 대화에서 갈아탈 수 있는 곳: 새 대화가 열린 시각에 가장 가까운 역
  const xfers = c.turns.map(() => []);
  for (const [a, b, why] of DATA.links) {
    if (a === id) {
      const tq = chats[b].at.times[0][0], ts = c.at.times.map(s => Math.abs(s[0] - tq));
      xfers[ts.indexOf(Math.min(...ts))].push({ c: chats[b], why });
    }
    if (b === id) xfers[0].push({ c: chats[a], why });
  }

  c.turns.forEach((u, i) => {
    const x = X[i], y0 = depth[i] * DROP, now = c.active && i === n - 1;
    // 역
    const at = u.id ? { "data-turn": u.id } : {};   // 실제 대화의 역은 누르면 가닥 창에서 그 역을 열어요
    if (now) { el("circle", { cx: x, cy: y0, r: 16, class: "now-ring", ...at }, G); el("circle", { cx: x, cy: y0, r: 9, class: "now-dot", ...at }, G); }
    else if (u.side) el("circle", { cx: x, cy: y0, r: 7, class: "st-side", ...at }, G);
    else el("circle", { cx: x, cy: y0, r: u.d ? 9 : 7, class: "dot", ...at }, G);
    // 이름: 본선은 위로 45°(정함은 굵게), 곁길은 지선 아래로 45°
    const [nx, ny, rot] = u.side ? [x + 10, y0 + 18, 45] : [x - 4, -24, -45];
    const nm = el("text", { x: nx, y: ny, transform: `rotate(${rot} ${nx} ${ny})`, class: `st-name${u.d || now ? " dec" : ""}${u.side ? " side" : ""}` }, G);
    nm.textContent = now ? `지금 · ${u.t}` : u.t;

    // 아래에 쌓기: 환승 → 산출물 → 할 일. 넘치면 마지막 칸을 +n으로
    const stack = [
      ...xfers[i].map(v => ({ kind: "x", ...v })),
      ...u.f.map(f => ({ kind: "f", f })),
      ...u.todo.map(([text, done]) => ({ kind: "t", text, done })),
    ];
    const shown = stack.length > SHOW ? stack.slice(0, SHOW - 1) : stack;
    shown.forEach((s, j) => {
      const y = y0 + (u.side ? 34 : BAR / 2 + 24) + j * STACK, g = el("g", {}, G);
      if (s.kind === "x") {
        el("circle", { cx: x, cy: y, r: 11, fill: s.c.p.color }, g);
        el("text", { x, y: y + 4, "text-anchor": "middle", class: "bullet", style: `fill:${s.c.p.ink || "#fff"}`, "data-chat": s.c.id }, g).textContent = s.c.no;
        g.dataset.chat = s.c.id;
        el("title", {}, g).textContent = `${s.why} · ${s.c.p.name} ${s.c.title}`;
      } else if (s.kind === "f") {
        // 산출물: 작은 검은 점 하나에 파일 이름을 회색으로 얇게 (길면 줄이고, 전체 이름은 마우스를 올리면)
        el("circle", { cx: x, cy: y, r: 4.5, class: "dot" }, g);
        el("text", { x: x + 9, y: y + 4, class: "made" }, g).textContent = s.f.length > 10 ? s.f.slice(0, 9) + "…" : s.f;
        el("title", {}, g).textContent = `산출물 · ${s.f}`;
      } else {
        el("circle", { cx: x, cy: y, r: 10, class: `todo${s.done ? " done" : ""}` }, g);
        el("title", {}, g).textContent = `${s.text}${s.done ? " (끝냄)" : ""}`;
      }
    });
    if (stack.length > SHOW) {
      const y = y0 + (u.side ? 34 : BAR / 2 + 24) + (SHOW - 1) * STACK, g = el("g", {}, G);
      el("circle", { cx: x, cy: y, r: 11, class: "more" }, g);
      el("text", { x, y: y + 4, "text-anchor": "middle", class: "chip", style: "fill:var(--ink2)" }, g).textContent = `+${stack.length - SHOW + 1}`;
      el("title", {}, g).textContent = stack.slice(SHOW - 1).map(s => s.kind === "f" ? s.f : s.kind === "t" ? s.text : s.c.title).join("\n");
    }
  });

  document.getElementById("crumb").textContent = `${p.name} · ${c.no} ${c.title}`;
  document.body.classList.add("strip-on");
  stripZ.fit(sworld.getBBox(), 60, true, 1.3);   // 짧은 대화도 지나치게 커지지 않게
  const q = new URLSearchParams(location.search); q.set("chat", id); history.replaceState(null, "", `?${q}`);
}
function closeStrip() {
  document.body.classList.remove("strip-on");
  mapZ.all();
  const q = new URLSearchParams(location.search); q.delete("chat"); history.replaceState(null, "", `?${q}`);
}
// 한 줄 노선도의 환승 동그라미를 누르면 그 대화로 갈아타요
ssvg.addEventListener("click", () => {
  const id = stripZ.picked("[data-chat]")?.dataset.chat;
  if (id) openStrip(id);
});
document.getElementById("back").onclick = closeStrip;

// ── 가닥 창에서 그 대화(그 역)를 열어요. 가닥 창 위에 겹쳐 열렸으면 가닥 창에 알리고, 따로 열렸으면 연 창에 맡겨요
const EMBED = window.parent !== window;
if (EMBED) document.body.classList.add("embed");
let shown = null;   // 한 줄 노선도에 띄운 대화 id
function openInGadak(chatId, turnId) {
  const c = chats[chatId];
  if (!c || !c.p.id) return;   // 만든 예시에는 열 대화가 없어요
  const order = { chat: chatId, project: c.p.id, ...(turnId ? { turn: turnId } : {}) };
  if (EMBED) parent.postMessage({ gadakOpen: order }, location.origin);
  else if (window.opener?.gadakOpen) { window.opener.gadakOpen(order); window.opener.focus(); }
  else location.href = "/";
}
document.getElementById("open").onclick = () => openInGadak(shown);
// 닫기: 가닥 창이 열어 둔 길(gadakMapClose)을 바로 부르고, 안 되면 메시지로 알려요
const closeMap = () => {
  try { if (typeof parent.gadakMapClose === "function") return parent.gadakMapClose(); } catch (e) {}
  parent.postMessage({ gadakMap: "close" }, location.origin);
};
document.getElementById("close").onclick = closeMap;
// 한 줄 노선도의 역을 누르면 그 역에서 열어요
ssvg.addEventListener("click", () => {
  const turn = stripZ.picked("[data-turn]")?.dataset.turn;
  if (turn) openInGadak(shown, turn);
});

const cur = () => document.body.classList.contains("strip-on") ? stripZ : document.body.classList.contains("poster-on") ? posterZ : mapZ;
document.getElementById("in").onclick = () => cur().zoomAt(1.6, ...cur().center());
document.getElementById("out").onclick = () => cur().zoomAt(1 / 1.6, ...cur().center());
document.getElementById("fit").onclick = () => cur().all();
addEventListener("keydown", e => {
  if (e.key === "+" || e.key === "=") cur().zoomAt(1.4, ...cur().center());
  else if (e.key === "-") cur().zoomAt(1 / 1.4, ...cur().center());
  else if (e.key === "0") cur().all();
  else if (e.key === "Escape" && cur() === stripZ) closeStrip();
  else if (e.key === "Escape" && EMBED) closeMap();
});
addEventListener("resize", () => cur().all());
mapZ.all(true);
const deep = new URLSearchParams(location.search).get("chat");
if (chats[deep]) openStrip(deep);
else if (new URLSearchParams(location.search).has("poster")) togglePoster(true);
</script>
</body>
</html>
