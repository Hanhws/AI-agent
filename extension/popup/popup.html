<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>가닥</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <!-- 심볼 A: 본선 + 위로 빠지는 지선 + 보통 역 하나 + 빨갛게 채운 ‘지금’ (README 7-12) -->
    <svg viewBox="20 56 164 92" width="34" height="19" aria-hidden="true">
