<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>갈래 프로토타입</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='20 26 160 160'%3E%3Cg stroke='%23141414' stroke-width='16' stroke-linecap='round'%3E%3Cpath d='M36 122H166M100 122L132 80H154'/%3E%3C/g%3E%3Ccircle cx='100' cy='122' r='13' fill='%23fff' stroke='%23141414' stroke-width='10'/%3E%3Ccircle cx='154' cy='122' r='16' fill='%23C8401A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Follows draft D: floating map card over paper, thin grey rail, one accent that means "decided" (ring) or "now" (fill). */
:root {
  --railw: 56px; --rx: 28px;
  --bg: #FAF9F6; --surface: #FFFFFF; --fg: #141414; --fg2: #3F3F46; --muted: #6E6B66; --faint: #8F8B84;
  --line: #E6E3DD; --bubble: #EFEDE8; --accent: #C8401A; --halo: #F6DDD4; --see: #EDEBE6;
  --stem: #D6D2CB; --trunk: #A9A59E; --ring: #BDB9B2; --rail: #D9D5CE; --viewport: rgba(20,20,20,0.05); --flash: #FBEDE7;
  --tip: #141414; --tip-fg: #F4F2EE; --tip-sub: #C9C5BE; --shadow: 0 12px 32px rgba(20,20,20,0.08);
  --display: 'Noto Serif KR', 'Apple SD Gothic Neo', serif;
  --body: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161513; --surface: #1F1E1B; --fg: #F1EFEA; --fg2: #D6D3CD; --muted: #A8A49D; --faint: #8A867E;
  --line: #34322E; --bubble: #2A2825; --accent: #F0704A; --halo: #4A2A20; --see: #34322E;
  --stem: #45433E; --trunk: #6F6B64; --ring: #6A665F; --rail: #3E3C38; --viewport: rgba(255,255,255,0.06); --flash: #3A2620;
  --tip: #F1EFEA; --tip-fg: #161513; --tip-sub: #5A5750; --shadow: 0 12px 32px rgba(0,0,0,0.4); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161513; --surface: #1F1E1B; --fg: #F1EFEA; --fg2: #D6D3CD; --muted: #A8A49D; --faint: #8A867E;
  --line: #34322E; --bubble: #2A2825; --accent: #F0704A; --halo: #4A2A20; --see: #34322E;
  --stem: #45433E; --trunk: #6F6B64; --ring: #6A665F; --rail: #3E3C38; --viewport: rgba(255,255,255,0.06); --flash: #3A2620;
  --tip: #F1EFEA; --tip-fg: #161513; --tip-sub: #5A5750; --shadow: 0 12px 32px rgba(0,0,0,0.4); color-scheme: dark }

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; }
button { font-family: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); }

header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { display: inline-flex; align-items: center; gap: 8px; padding: 0; border: 0; background: transparent; cursor: pointer; }
.logo svg { display: block; overflow: visible; }
.mark line { stroke: var(--fg); }
.mark .m-main { fill: var(--surface); stroke: var(--fg); }
.mark .m-spur { fill: var(--surface); stroke: var(--ring); }
.mark .m-now { fill: var(--accent); stroke: none; }
.brand b { font-family: var(--display); font-size: 19px; line-height: 1; }
.brand span { font-size: 12.5px; color: var(--faint); }
.controls { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.btn { height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 13px; color: var(--muted); cursor: pointer; }
.btn:hover { border-color: var(--ring); color: var(--fg); }
.btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); font-weight: 600; }
.btn[disabled] { opacity: 0.35; cursor: default; }
.btn.ask { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.switch { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.switch button { height: 30px; padding: 0 12px; border: 0; background: var(--surface); font-size: 12.5px; color: var(--faint); cursor: pointer; }
.switch button + button { border-left: 1px solid var(--line); }
.switch button[aria-pressed="true"] { color: var(--fg); font-weight: 600; background: var(--bg); }

/* map card */
.drawer { min-width: 0; margin: 16px 16px 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.drawer[hidden] { display: none; }
.map-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 20px; padding: 18px 24px 0; }
.map-title { font-family: var(--display); font-size: 18px; font-weight: 700; }
.map-status { font-size: 12.5px; color: var(--faint); }
.map-head .sp { flex: 1; }
.linkbtn { border: 0; background: transparent; padding: 0; font-size: 13px; color: var(--faint); cursor: pointer; }
.linkbtn:hover { color: var(--fg); }
.qbtn { border: 0; background: transparent; padding: 0; font-size: 14px; font-weight: 600; color: var(--accent); cursor: pointer; }
.map-scroll { overflow-x: auto; }
.map-scroll.ovf { -webkit-mask-image: linear-gradient(to right, transparent 0, #000 28px, #000 calc(100% - 28px), transparent 100%); mask-image: linear-gradient(to right, transparent 0, #000 28px, #000 calc(100% - 28px), transparent 100%); }
.map { position: relative; min-width: 640px; }

.mline { position: absolute; height: 4px; background: var(--fg); transform: translateY(-2px); }
.mline.wait { height: 0; border-top: 3px dotted var(--fg); background: none; transform: translateY(-1.5px); }
.stem { position: absolute; width: 2px; background: var(--stem); transform: translateX(-1px); }
.map.reveal path.trunk { stroke-dasharray: 1; animation: drawline .8s cubic-bezier(.3,.7,.2,1) .12s both; }
.map.reveal path.spur { stroke-dasharray: 1; animation: drawline .5s ease-out .7s both; }
.map.reveal path:not(.trunk):not(.spur) { animation: fadein .4s ease .8s both; }
.map.reveal .st, .map.reveal .cap { animation: popin .42s cubic-bezier(.3,1.5,.5,1) both; }
.map.reveal .lbl { animation: rise-l .4s ease-out both; }
.map.reveal .cnt, .map.reveal .seg { animation: fadein .4s ease both; }
@keyframes drawline { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes popin { from { opacity: 0; transform: translate(-50%, -50%) scale(0.2); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
@keyframes rise-l { from { opacity: 0; transform: translate(-50%, 6px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.map svg.lines { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.cnt { position: absolute; font-size: 11px; color: var(--faint); transform: translateY(-50%); pointer-events: none; }

.st { position: absolute; padding: 0; border-radius: 50%; box-sizing: border-box; cursor: pointer; background: var(--surface); transform: translate(-50%, -50%); transition: box-shadow .25s, transform .2s; }
.st:hover { transform: translate(-50%, -50%) scale(1.12); }
.st.main { width: 16px; height: 16px; border: 3px solid var(--fg); }
.st.dec { width: 20px; height: 20px; border: 4px solid var(--accent); }
.st.cur { width: 20px; height: 20px; border: 0; background: var(--accent); box-shadow: 0 0 0 6px var(--halo); }
.st.br { width: 12px; height: 12px; border: 2px solid var(--muted); }
.st.closed { width: 12px; height: 12px; border: 2px solid var(--ring); }
.st.closed.l2 { width: 10px; height: 10px; border-color: var(--stem); }
.st.br.cur, .st.l2.cur { width: 14px; height: 14px; border: 0; box-shadow: 0 0 0 5px var(--halo); }
.st.tick { width: 8px; height: 8px; border: 2px solid var(--fg); }
.st.tick.tdec { border-color: var(--accent); }
.st.tick.tcur { border: 0; background: var(--accent); box-shadow: 0 0 0 4px var(--halo); }
.st.viewing, .cap.viewing { box-shadow: 0 0 0 6px var(--see); }
.st.cur.viewing, .cap.cur.viewing { box-shadow: 0 0 0 6px var(--halo); }
.st.ref-hl, .cap.ref-hl { box-shadow: 0 0 0 6px var(--halo); }

.cap { position: absolute; transform: translate(-50%, -50%); box-sizing: border-box; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--surface); display: flex; align-items: center; justify-content: center; gap: 4px; cursor: pointer; transition: box-shadow .25s; }
.cap.main { border: 3px solid var(--fg); }
.cap.dec { border: 4px solid var(--accent); }
.cap.cur { border: 0; background: var(--accent); box-shadow: 0 0 0 6px var(--halo); }
.cell { width: 6px; height: 6px; padding: 0; border-radius: 50%; box-sizing: border-box; border: 0; background: var(--fg); cursor: pointer; }
.cap.cur .cell { background: var(--surface); }
.cell.open { background: transparent; border: 1.5px solid var(--accent); }
.cap.cur .cell.open { border-color: var(--surface); }
.cell:hover { transform: scale(1.35); }

.lbl { position: absolute; transform: translateX(-50%); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
.lbl .t { font-size: 14px; line-height: 19px; color: var(--fg2); text-wrap: balance; }
.lbl .t.now { font-weight: 600; color: var(--fg); }
.lbl .f { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
.sq { width: 7px; height: 7px; background: var(--fg); display: inline-block; flex: none; }

.seg { position: absolute; top: 4px; display: flex; align-items: baseline; gap: 6px; padding: 2px 4px; border: 0; border-radius: 4px; background: transparent; font-size: 11.5px; color: var(--faint); cursor: pointer; white-space: nowrap; }
.seg b { font-size: 12.5px; font-weight: 600; color: var(--fg2); }
.seg.shut b { font-weight: 500; color: var(--faint); }
.seg:hover b { color: var(--accent); }

/* chat + rail */
.body { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); min-height: 0; }
.chat { position: relative; overflow-y: auto; padding: 24px calc(var(--railw) + 24px) 40px 16px; }
.thread { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.turn { display: flex; flex-direction: column; gap: 10px; padding: 8px 10px; margin: 0 -10px; border-radius: 12px; transition: background .6s; }
.turn.flash { background: var(--flash); }
.turn.enter { animation: rise .35s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.u { align-self: flex-end; display: flex; align-items: center; gap: 8px; max-width: 85%; }
.u .tag { font-size: 11px; color: var(--faint); white-space: nowrap; }
.u p { margin: 0; padding: 10px 14px; border-radius: 12px; background: var(--bubble); line-height: 1.55; }
.a { margin: 0; line-height: 1.7; color: var(--fg); max-width: 62ch; }
.a .files { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.a .file { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; }
a.file { text-decoration: none; }
a.file:hover { color: var(--accent); border-color: var(--accent); }
.part { border-radius: 6px; transition: background .6s; }
.part.flash { background: var(--flash); }
.seam { display: flex; align-items: center; gap: 12px; font-size: 12px; letter-spacing: 0.04em; color: var(--faint); }
.seam::before, .seam::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.rail { position: absolute; top: 0; bottom: 0; right: 8px; width: var(--railw); }
.rail .rline { position: absolute; left: calc(var(--rx) - 1px); width: 2px; background: var(--rail); }
.rail .vp { position: absolute; left: calc(var(--rx) - 17px); width: 34px; border-radius: 6px; background: var(--viewport); pointer-events: none; }
.rail-toggle { position: absolute; left: calc(var(--rx) - 21px); top: 6px; width: 42px; height: 36px; padding: 0; border: 0; border-radius: 8px; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.rail-toggle:hover { background: var(--viewport); }
.rail-toggle svg { display: block; overflow: visible; }
.rail-toggle .cv { font-size: 9px; line-height: 1; color: var(--accent); }
.rail .mark .m-main, .rail .mark .m-spur { fill: var(--bg); }
.rail .st.main { width: 10px; height: 10px; border: 0; background: var(--fg); }
.rail .st.dec { width: 10px; height: 10px; border: 2px solid var(--accent); background: var(--bg); }
.rail .st.cur { width: 14px; height: 14px; box-shadow: 0 0 0 5px var(--halo); }
.rail .st.br, .rail .st.closed { width: 9px; height: 9px; border-width: 2px; background: var(--bg); }
.rail .st.viewing, .rail .cap.viewing { box-shadow: 0 0 0 4px var(--see); }
.rail .st.cur.viewing, .rail .cap.cur.viewing { box-shadow: 0 0 0 5px var(--halo); }
.rail .cap { flex-direction: column; width: 10px; height: auto; padding: 3px 0; gap: 3px; border-radius: 5px; }
.rail .cap.main { border: 0; background: var(--fg); }
.rail .cap.main .cell { background: var(--bg); }
.rail .cap.dec { border-width: 2px; background: var(--bg); }
.rail .cell { width: 4px; height: 4px; }
.rail .fsq { position: absolute; width: 6px; height: 6px; background: var(--fg); transform: translateY(-50%); pointer-events: none; }
.rail-seam { position: absolute; left: calc(var(--rx) - 10px); width: 20px; height: 1px; background: var(--line); }

.tip { position: fixed; z-index: 10; max-width: 260px; padding: 12px 14px; border-radius: 10px; background: var(--tip); color: var(--tip-fg); font-size: 13px; line-height: 1.5; pointer-events: none; display: flex; flex-direction: column; gap: 4px; }
.tip b { font-size: 14px; font-weight: 600; }
.tip .s { color: var(--tip-sub); }
.tip .fl { display: flex; align-items: center; gap: 6px; color: var(--tip-sub); }
.tip .fl i { width: 7px; height: 7px; background: var(--tip-fg); flex: none; }
.pop { position: fixed; z-index: 11; width: min(360px, calc(100vw - 32px)); padding: 14px 16px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
.pop pre { margin: 0; white-space: pre-wrap; font-family: var(--body); font-size: 13px; line-height: 1.6; padding: 10px 12px; border-radius: 8px; background: var(--bubble); }
.pop .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }

.tip[hidden], .pop[hidden] { display: none; }
@media (max-width: 560px) { :root { --railw: 44px; --rx: 20px; } .brand span { display: none; } .drawer { margin: 12px 12px 0; } .map-head { padding: 14px 16px 0; } }
@media (prefers-reduced-motion: reduce) { .turn.enter { animation: none; } .st, .cap { transition: none; } }
</style>

<div class="app">
  <header>
    <div class="brand"><button class="logo" id="logo" type="button" aria-label="갈래 심볼 다시 재생"><b>갈래</b></button><span id="sub"></span></div>
    <div class="switch" role="group" aria-label="예시 대화 고르기">
      <button type="button" data-ex="session" aria-pressed="true">이번 기획 대화</button>
      <button type="button" data-ex="nba" aria-pressed="false">NBA 프로젝트</button>
    </div>
    <div class="controls">
      <button class="btn ask" id="ask" type="button" hidden>빠진 요청 다시 묻기</button>
      <button class="btn" id="reset" type="button">처음 상태로</button>
      <button class="btn primary" id="next" type="button">다음 턴 ▶</button>
    </div>
  </header>

  <section class="drawer" id="drawer" aria-label="대화 노선도">
    <div class="map-head">
      <span class="map-title" id="mapTitle"></span>
      <span class="map-status" id="status"></span>
      <span class="sp"></span>
      <button class="linkbtn" id="segAll" type="button" hidden></button>
      <button class="qbtn" id="qbtn" type="button" hidden></button>
      <button class="btn" id="toggle" type="button" aria-label="지도 접기">접기</button>
    </div>
    <div class="map-scroll" id="mapScroll"><div class="map" id="map"></div></div>
  </section>

  <div class="body">
    <div class="chat" id="chat"><div class="thread" id="thread"></div></div>
    <nav class="rail" id="rail" aria-label="대화 레일"></nav>
  </div>
</div>
<div class="tip" id="tip" hidden></div>
<div class="pop" id="pop" hidden role="dialog" aria-label="모아둔 수정사항"></div>

<script>
(function () {
  var CANVAS = '#';
  var PROTO = '#';
  var SYMBOL = 'https://claude.ai/artifact/W2rmoRqmq1qTQR95Z7LaLp';
  var HANDOFF = 'https://claude.ai/code/artifact/303753f7-13e0-4143-959f-b9705d2e5d9b';

  /* ---------- example 1: this planning conversation (38 messages, 6 segments) ---------- */
  var SESSION = [
    { id: 's1', seg: '기획', depth: 0, title: '실현 가능한가',
      user: 'Category C에 걸렸어. LLM 질문 정리 에이전트를 생각 중인데, 질문을 노드화해서 도식화하고 확장 프로그램으로 붙이면 어떨까? 구현 가능할지, 실현 가능성을 나랑 얘기해줘.',
      ai: '가능해요. 확장 프로그램이 LLM 화면의 대화를 읽고, 질문마다 본류·곁길·결정으로 나눠 노드로 그리면 돼요. 어려운 건 분류 정확도와 사이트마다 다른 화면 구조라서, 범위를 Claude·ChatGPT 두 곳으로 좁히는 걸 권해요.' },
    { id: 's2', depth: 0, title: '연계 문제의식',
      user: '내가 처음 생각한 방향은 LLM 화면 바로 옆에 토글로 붙는 방식이야. 연계된 문제의식이 또 어떤 게 있을까? 레딧 같은 데서 찾아줄래?',
      ai: '대화가 길어지면 앞 내용을 못 찾는다, 곁길 질문이 본론을 밀어낸다, 같은 걸 새 창에서 또 묻는다는 불만이 반복돼요. 분기 기능을 원하는 글도 많아서 문제 정의의 근거로 쓸 수 있어요.' },
    { id: 's3', depth: 0, title: '채팅창 없는 화면', dec: '채팅창을 새로 만들지 않음', files: [{ n: '질문 정리 에이전트 화면 (캔버스)', u: CANVAS }],
      user: '웹이나 앱에 채팅창이 또 있으면 그냥 LLM의 다른 발현처럼 보일 것 같아. 어떤 식으로 구현될 것 같아? 화면을 한 번 시각화해볼래?',
      ai: '입력창 없이 LLM 화면 옆에 흐름만 보여주는 패널로 그렸어요. 갈래는 대답하지 않고, 이미 나눈 대화를 정리만 해요.' },
    { id: 's4', depth: 0, title: '과거 대화 · 산출물', files: [{ n: '예시 · NBA 프로젝트 (보드 3개)', u: CANVAS }],
      parts: [
        { t: '과거 대화 불러와 재정렬', type: 'task' },
        { t: '산출물 제목·폴더 보이기', type: 'task' },

    drawerOpen = true; drawer.hidden = false; playMark(railMark, 0.7);
    focusMap = true; renderAll(); unfold();
  }
  /* the card grows open, the trunk draws left to right, stations pop in as the line reaches them */
  var foldTimer = null;
  function unfold() {
    if (reduce) return;
    clearTimeout(foldTimer);
    var h = drawer.scrollHeight;
    drawer.style.transition = 'none'; drawer.style.height = '0px'; drawer.style.opacity = '0'; drawer.style.transform = 'translateY(-6px)';
    void drawer.offsetHeight;
    drawer.style.transition = 'height .45s cubic-bezier(.2,.8,.2,1), opacity .3s ease, transform .45s cubic-bezier(.2,.8,.2,1)';
    drawer.style.height = h + 'px'; drawer.style.opacity = '1'; drawer.style.transform = 'none';
    var x0 = mapScroll.scrollLeft, vw = mapScroll.clientWidth;
    mapEl.classList.remove('reveal'); void mapEl.offsetWidth; mapEl.classList.add('reveal');
    Array.prototype.forEach.call(mapEl.querySelectorAll('.st, .cap, .lbl, .cnt'), function (e) {
      var x = parseFloat(e.style.left) || 0, k = Math.max(0, Math.min(1, (x - x0) / vw));
      e.style.animationDelay = (0.18 + k * 0.62 + (e.classList.contains('lbl') ? 0.06 : 0)).toFixed(2) + 's';
    });
    foldTimer = setTimeout(function () {
      drawer.style.transition = ''; drawer.style.height = ''; drawer.style.transform = '';
      mapEl.classList.remove('reveal');
      Array.prototype.forEach.call(mapEl.querySelectorAll('[style*="animation-delay"]'), function (e) { e.style.animationDelay = ''; });
    }, 1500);
  }
  function fold(done) {
    if (reduce) { done(); return; }
    clearTimeout(foldTimer); mapEl.classList.remove('reveal');
    drawer.style.transition = 'none'; drawer.style.height = drawer.offsetHeight + 'px'; void drawer.offsetHeight;
    drawer.style.transition = 'height .32s cubic-bezier(.4,0,.2,1), opacity .22s ease, transform .32s ease';
    drawer.style.height = '0px'; drawer.style.opacity = '0'; drawer.style.transform = 'translateY(-6px)';
    foldTimer = setTimeout(function () { done(); drawer.style.transition = ''; drawer.style.height = ''; drawer.style.opacity = ''; drawer.style.transform = ''; }, 330);
  }

  document.getElementById('next').addEventListener('click', function () {
    if (shown >= TURNS.length) return;
    var t = TURNS[shown]; shown++;
    if (t.segStart) { thread.appendChild(seamNode(t)); expanded = {}; }
    expanded[t.s] = true; focusMap = true;
    var n = turnNode(t, !reduce); turnEls[t.id] = n; thread.appendChild(n);
    renderAll();
    chat.scrollTo({ top: chat.scrollHeight, behavior: reduce ? 'auto' : 'smooth' });
  });
  document.getElementById('reset').addEventListener('click', resetState);
  document.getElementById('toggle').addEventListener('click', toggleDrawer);
  document.getElementById('ask').addEventListener('click', function () {
    var last = null;
    openParts().forEach(function (o) {
      o.p.open = false; var x = { id: o.t.id, part: o.i, at: shown }; extras.push(x);
      last = followNode(x, !reduce); thread.appendChild(last);
    });
    renderAll();
    if (last) chat.scrollTo({ top: chat.scrollHeight, behavior: reduce ? 'auto' : 'smooth' });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.switch button'), function (b) {
    b.addEventListener('click', function () { load(b.dataset.ex); playMark(logoMark); if (drawerOpen) unfold(); });
  });
  window.addEventListener('resize', function () { requestAnimationFrame(renderAll); });

  load('session');
  requestAnimationFrame(function () { requestAnimationFrame(unfold); });
  setTimeout(function () { playMark(logoMark); }, 250);
  requestAnimationFrame(function () { chat.scrollTop = chat.scrollHeight; focusMap = true; renderAll(); });
})();
</script>

</body></html>
